<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réserver · Lashly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f8;--surface:#fff;--ink:#1f1726;--mute:#6b6475;--line:#e6e2ea;--acc:#4a1d5c;--acc-ink:#fff;--soft:#eeebf2;--ok:#f1ecf5;--ok-ink:#4a1d5c;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121c;--surface:#211a28;--ink:#f1ebf5;--mute:#a99bb4;--line:#393043;--acc:#c58be0;--acc-ink:#1b1022;--soft:#2c2336;--ok:#2c2336;--ok-ink:#e6c9f3;--err:#f2b8b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17121c;--surface:#211a28;--ink:#f1ebf5;--mute:#a99bb4;--line:#393043;--acc:#c58be0;--acc-ink:#1b1022;--soft:#2c2336;--ok:#2c2336;--ok-ink:#e6c9f3;--err:#f2b8b5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:600}
.top b{display:block;font-weight:600;line-height:1.2}
.top span{color:var(--mute);font-size:.9rem}
.bar{display:flex;gap:6px;margin-bottom:20px}
.bar i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.bar i.on{background:var(--acc)}
h1{font-size:1.5rem;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:0 0 14px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px rgba(31,23,38,.05)}
.opt:hover{border-color:var(--acc)}
.opt.open{margin-bottom:0;border-color:var(--acc);border-bottom-left-radius:0;border-bottom-right-radius:0;box-shadow:none}
.desc{background:var(--surface);border:1px solid var(--acc);border-top:0;border-radius:0 0 12px 12px;padding:2px 16px 16px;margin-bottom:10px}
.desc p{margin:0 0 14px;color:var(--mute)}
.opt b{font-weight:600;display:block}
.m{color:var(--mute);font-size:.9rem}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.day{flex:0 0 auto;min-width:62px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;cursor:pointer}
.day span{display:block;font-size:.8rem;color:var(--mute)}
.day b{font-weight:600;font-size:1.1rem}
.day[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid var(--line);background:var(--ok);color:var(--ok-ink);border-radius:8px;padding:9px 14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.slot[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:72px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:.9rem;color:var(--ink)}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.err{color:var(--err);font-size:.9rem;margin-top:10px;min-height:1.2em}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 16px;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.back{flex:0 0 auto}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.done{text-align:center;padding:10px 0}
.tick{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:1.6rem;margin:0 auto 14px}
.note{color:var(--mute);font-size:.85rem;margin-top:14px}
</style>
</head>
<body>
<main>
  <div class="top"><span class="mark" aria-hidden="true">L</span><div><b>Studio exemple</b><span>Extensions de cils · réservation en ligne</span></div></div>
  <div class="bar" id="bar"></div>
  <div id="v"></div>
</main>
<script>
var SV=[{id:1,n:"Pose classique (cil à cil)",d:120,p:80,x:"Une extension posée sur chaque cil naturel. Le résultat est naturel, avec un effet mascara qui allonge et structure le regard. Idéale pour une première pose."},{id:2,n:"Volume russe",d:150,p:110,x:"Plusieurs extensions très fines posées en éventail sur chaque cil naturel. L’effet est fourni et dense, sans alourdir le regard."},{id:3,n:"Remplissage (2-3 semaines)",d:60,p:45,x:"À faire environ 2 à 3 semaines après ta pose pour remplacer les cils tombés naturellement. Au-delà, une nouvelle pose complète peut être nécessaire."},{id:4,n:"Dépose",d:30,p:25,x:"Retrait en douceur de tes extensions avec un produit adapté, sans abîmer tes cils naturels."}];
var H={1:["09:00","18:00"],2:["09:00","18:00"],3:["09:00","18:00"],4:["09:00","18:00"],5:["09:00","17:00"]};
var PAUSE=[750,810],BUF=10;
var st={step:1,svc:null,open:null,date:null,slot:null,f:{n:"",t:"",e:"",a:"",c:false},err:""};
function tm(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function ft(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function fd(m){var h=Math.floor(m/60),r=m%60;return (h?h+" h":"")+(r?(h?" ":"")+r+" min":"")}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function openDays(){var o=[],d=new Date();for(var i=0;o.length<14&&i<30;i++){var x=new Date(d);x.setDate(d.getDate()+i);if(H[x.getDay()])o.push(x)}return o}
function slotsFor(date,dur){
  var h=H[date.getDay()];if(!h)return[];var o=tm(h[0]),c=tm(h[1]),out=[];
  var now=new Date(),td=date.toDateString()===now.toDateString(),nm=now.getHours()*60+now.getMinutes();
  for(var s=o;s+dur<=c;s+=30){
    if(s<PAUSE[1]&&s+dur>PAUSE[0])continue;
    if(td&&s<=nm)continue;
    if((date.getDate()+s/30)%4===0)continue;
    out.push(s)}
  return out
}
function long(d){return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function bar(){document.getElementById("bar").innerHTML=[1,2,3].map(function(i){return '<i class="'+(st.step>=i?"on":"")+'"></i>'}).join("")}
function render(){
  bar();document.getElementById("bar").style.display=st.step===4?"none":"flex";
  var v=document.getElementById("v"),h="";
  if(st.step===1){
    h='<h1>Choisis ta prestation</h1>'+SV.map(function(s){var o=st.open===s.id;return '<button class="opt'+(o?' open':'')+'" aria-expanded="'+o+'" onclick="tog('+s.id+')"><span><b>'+esc(s.n)+'</b><span class="m">'+fd(s.d)+'</span></span><span class="price">'+s.p+' €</span></button>'+(o?'<div class="desc"><p>'+esc(s.x)+'</p><button class="btn pri" style="width:100%" onclick="pickSv('+s.id+')">Choisir cette prestation</button></div>':'')}).join("")
  }else if(st.step===2){
    var sv=SV.find(function(s){return s.id===st.svc}),days=openDays();
    if(!st.date)st.date=days[0].toDateString();
    var cur=days.find(function(d){return d.toDateString()===st.date})||days[0];
    h='<h1>Choisis ton créneau</h1><p class="m" style="margin-top:-8px">'+esc(sv.n)+' · '+fd(sv.d)+' · '+sv.p+' €</p>'
     +'<div class="days">'+days.map(function(d){return '<button class="day" aria-pressed="'+(d.toDateString()===st.date)+'" onclick="pickDay(\''+d.toDateString()+'\')"><span>'+d.toLocaleDateString("fr-FR",{weekday:"short"})+'</span><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString("fr-FR",{month:"short"})+'</span></button>'}).join("")+'</div>'
     +'<div class="slots">'+(slotsFor(cur,sv.d+BUF).map(function(s){return '<button class="slot" aria-pressed="'+(st.slot===s)+'" onclick="pickSlot('+s+')">'+ft(s)+'</button>'}).join("")||'<p class="m">Aucun créneau ce jour-là, essaie un autre jour.</p>')+'</div>'
     +'<div class="row"><button class="btn back" onclick="go(1)">Retour</button><button class="btn pri" '+(st.slot===null?"disabled":"")+' onclick="go(3)">Continuer</button></div>'
  }else if(st.step===3){
    var f=st.f;
    h='<h1>Tes coordonnées</h1>'+summary()
     +'<label for="n">Prénom et nom</label><input id="n" type="text" autocomplete="name" value="'+esc(f.n)+'">'
     +'<label for="t">Téléphone</label><input id="t" type="tel" autocomplete="tel" value="'+esc(f.t)+'">'
     +'<label for="e">Email</label><input id="e" type="email" autocomplete="email" value="'+esc(f.e)+'">'
     +'<label for="a">Allergies ou réactions connues (colle, patchs). Facultatif</label><textarea id="a">'+esc(f.a)+'</textarea>'
     +'<label class="chk"><input id="c" type="checkbox" '+(f.c?"checked":"")+'><span>J’accepte que mes données soient utilisées par le studio pour gérer mon rendez-vous.</span></label>'
     +'<div class="err" id="er" role="alert">'+esc(st.err)+'</div>'
     +'<div class="row"><button class="btn back" onclick="keep();go(2)">Retour</button><button class="btn pri" onclick="confirmBk()">Confirmer la réservation</button></div>'
  }else{
    h='<div class="done"><div class="tick" aria-hidden="true">✓</div><h1>Rendez-vous confirmé</h1></div>'+summary()
     +'<p class="m">Merci '+esc(st.f.n.split(" ")[0])+'. Dans la version finale, tu recevras une confirmation et un rappel. Cette démo n’envoie aucun message.</p>'
     +'<div class="row"><button class="btn" onclick="reset()">Nouvelle réservation</button></div>'
  }
  v.innerHTML=h;window.scrollTo(0,0)
}
function summary(){
  var sv=SV.find(function(s){return s.id===st.svc}),d=openDays().find(function(x){return x.toDateString()===st.date});
  return '<div class="sum"><div><b>'+esc(sv.n)+'</b><span class="price">'+sv.p+' €</span></div><div class="m"><span>'+long(d)+' à '+ft(st.slot)+'</span><span>'+fd(sv.d)+'</span></div></div>'
}
function tog(id){st.open=st.open===id?null:id;var y=window.scrollY;render();window.scrollTo(0,y)}
function pickSv(id){st.svc=id;st.slot=null;st.date=null;go(2)}
function pickDay(d){st.date=d;st.slot=null;render()}
function pickSlot(s){st.slot=s;render()}
function go(n){st.step=n;st.err="";render()}
function keep(){var g=function(i){return document.getElementById(i)};st.f={n:g("n").value,t:g("t").value,e:g("e").value,a:g("a").value,c:g("c").checked}}
function confirmBk(){
  keep();var f=st.f;
  if(f.n.trim().length<2){st.err="Indique ton prénom et ton nom."}
  else if(f.t.replace(/\D/g,"").length<9){st.err="Indique un numéro de téléphone valide."}
  else if(!/^\S+@\S+\.\S+$/.test(f.e)){st.err="Indique une adresse email valide."}
  else if(!f.c){st.err="Coche la case pour accepter l’utilisation de tes données."}
  else{go(4);return}
  document.getElementById("er").textContent=st.err
}
function reset(){st={step:1,svc:null,date:null,slot:null,f:{n:"",t:"",e:"",a:"",c:false},err:""};render()}
render();
</script>
</body>
</html>
